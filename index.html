/* =====================================================
   STATUS
===================================================== */

function status(text){
  document.getElementById("status").textContent=text;
}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("player",{

    width:"100%",
    height:"400",

    videoId:"",

    playerVars:{
      playsinline:1,
      controls:1,
      origin:location.origin
    },

    events:{

      onReady:()=>{

        ready=true;

        player.setVolume(100);

        status(
          host
          ? "Room ready — share the URL"
          : "Connected"
        );

      },


      onStateChange:e=>{

        if(changing)
          return;


        /* PLAY */

        if(
          e.data===
          YT.PlayerState.PLAYING
        ){

          send({
            type:"play",
            time:player.getCurrentTime()
          });

        }


        /* PAUSE */

        if(
          e.data===
          YT.PlayerState.PAUSED
        ){

          send({
            type:"pause",
            time:player.getCurrentTime()
          });

        }


        /* END */

        if(
          e.data===
          YT.PlayerState.ENDED &&
          host
        ){

          next();

        }

      },


      onError:e=>{

        const errors={

          2:"Invalid YouTube video.",

          5:"YouTube HTML5 player error.",

          100:"Video not found or private.",

          101:"This video cannot be embedded.",

          150:"This video cannot be embedded.",

          153:"YouTube rejected the player. Use HTTPS."

        };

        status(
          errors[e.data] ||
          "YouTube error: "+e.data
        );

      }

    }

  });

}


/* =====================================================
   GET YOUTUBE VIDEO ID
===================================================== */

function getID(text){

  try{

    let u=new URL(text);


    if(
      u.hostname==="youtu.be" ||
      u.hostname==="www.youtu.be"
    ){

      return u.pathname.slice(1);

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.searchParams.get("v")
      ){

        return u.searchParams.get("v");

      }


      let parts=
        u.pathname.split("/");


      if(
        parts[1]==="shorts" ||
        parts[1]==="embed" ||
        parts[1]==="live"
      ){

        return parts[2];

      }

    }

  }catch{}

  return null;
}


/* =====================================================
   NORMAL ADD
===================================================== */

function add(){

  let input=
    document.getElementById("url");

  let text=
    input.value.trim();


  if(!text)
    return;


  let id=
    getID(text);


  if(id){

    if(host){

      queue.push(id);


      if(!current)
        next();


      render();
      sync();

    }else{

      send({
        type:"add",
        id:id
      });

    }


    input.value="";

    return;

  }


  window.open(

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(text),

    "_blank"

  );

}


/* =====================================================
   BAJSOLLE CLASSICS
===================================================== */

function playBajsolleClassic(){

  if(!host){

    send({
      type:"classic"
    });

    status(
      "Starting Bajsolle Classics..."
    );

    return;

  }


  startClassicShuffle();

}


/* =====================================================
   SHUFFLE ENTIRE CLASSICS LIST
===================================================== */

function startClassicShuffle(){

  /*
    Copy the list.
    The original Classics list stays unchanged.
  */

  let shuffled=
    [...classics];


  /*
    Fisher-Yates shuffle.
    This creates a randomized order
    without duplicates.
  */

  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      shuffled[i],
      shuffled[j]
    ]=[
      shuffled[j],
      shuffled[i]
    ];

  }


  /*
    Replace the queue with the
    entire randomized Classics list.
  */

  queue=[
    ...shuffled
  ];


  /*
    Start the first song.
  */

  current=null;

  next();


  status(
    "🎵 Bajsolle Classics — "+
    shuffled.length+
    " songs shuffled"
  );

}


/* =====================================================
   ADD CUSTOM CLASSIC
===================================================== */

function addClassicAndPlay(){

  let input=
    document.getElementById("classicUrl");


  let id=
    getID(
      input.value.trim()
    );


  if(!id){

    status(
      "Please enter a valid YouTube URL."
    );

    return;

  }


  if(!host){

    send({

      type:"classicAdd",

      id:id

    });

    input.value="";

    return;

  }


  addClassicAndPlayById(id);

  input.value="";

}


/* =====================================================
   ADD CUSTOM CLASSIC BY ID
===================================================== */

function addClassicAndPlayById(id){

  /*
    Add it to the Classics pool
    if it isn't already there.
  */

  if(
    !classics.includes(id)
  ){

    classics.push(id);

  }


  /*
    Add it immediately after
    the currently playing song.
  */

  if(current){

    queue.splice(
      1,
      0,
      id
    );

  }else{

    queue.push(id);

    next();

  }


  render();
  sync();


  status(
    "Classic added — playing next."
  );

}


/* =====================================================
   RANDOM YOUTUBE
===================================================== */

function randomYouTube(){

  const searches=[

    "random music",
    "random rock music",
    "random country music",
    "random pop music",
    "random electronic music",
    "random metal music",
    "random indian music",
    "random mexican music",
    "random swedish music",
    "random balkan music",
    "random 90s music",
    "random 2000s music"

  ];


  let query=
    searches[
      Math.floor(
        Math.random()*searches.length
      )
    ];


  window.open(

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(query),

    "_blank"

  );

}


/* =====================================================
   REMOVE
===================================================== */

function remove(index){

  if(!host){

    send({

      type:"remove",

      index:index

    });

    return;

  }


  if(
    index<0 ||
    index>=queue.length
  )
    return;


  let wasCurrent=
    queue[index]===current;


  queue.splice(
    index,
    1
  );


  if(wasCurrent){

    current=null;

    next();

    return;

  }


  render();
  sync();

}


/* =====================================================
   NEXT
===================================================== */

function next(){

  /*
    If the current song is at the
    front of the queue, remove it.

    This happens when a song finishes.
  */

  if(
    current &&
    queue[0]===current
  ){

    queue.shift();

  }


  /*
    Nothing left.
  */

  if(!queue.length){

    current=null;


    if(ready)
      player.stopVideo();


    render();
    sync();

    return;

  }


  /*
    Select the next song.
  */

  current=
    queue[0];


  changing=true;


  player.loadVideoById(
    current
  );


  setTimeout(
    ()=>changing=false,
    700
  );


  render();
  sync();

}


/* =====================================================
   RENDER QUEUE
===================================================== */

function render(){

  document
    .getElementById("queue")
    .innerHTML=

    queue.map((id,i)=>`

      <div class="item">

        <span>
          ${i===0 && id===current ? "▶ " : ""}
          ${i+1}. ${id}
        </span>

        <button
          onclick="remove(${i})"
        >
          ×
        </button>

      </div>

    `).join("");

}


/* =====================================================
   VOLUME
===================================================== */

document
  .getElementById("volume")
  .oninput=function(){

    let value=
      Number(this.value);


    if(ready)
      player.setVolume(value);


    send({

      type:"volume",

      volume:value

    });

  };


/* =====================================================
   SEND
===================================================== */

function send(data){

  if(
    conn &&
    conn.open
  ){

    conn.send(data);

  }

}


/* =====================================================
   FULL STATE SYNC
===================================================== */

function sync(){

  send({

    type:"state",

    queue:queue,

    current:current,

    time:
      ready && current
      ? player.getCurrentTime()
      : 0,

    playing:
      ready &&
      current &&
      player.getPlayerState()===
      YT.PlayerState.PLAYING,

    volume:
      ready
      ? player.getVolume()
      : 100

  });

}


/* =====================================================
   RECEIVE DATA
===================================================== */

function apply(data){


  /* FULL STATE */

  if(
    data.type==="state"
  ){

    queue=
      data.queue || [];


    render();


    if(
      data.volume!=null
    ){

      player.setVolume(
        data.volume
      );


      document
        .getElementById("volume")
        .value=
        data.volume;

    }


    if(
      data.current!==current
    ){

      current=
        data.current;


      if(current){

        changing=true;


        player.loadVideoById(
          current,
          data.time || 0
        );


        setTimeout(()=>{

          changing=false;


          if(data.playing)
            player.playVideo();

        },700);

      }

    }else if(current){

      changing=true;


      player.seekTo(
        data.time || 0,
        true
      );


      if(data.playing)
        player.playVideo();
      else
        player.pauseVideo();


      setTimeout(
        ()=>changing=false,
        300
      );

    }


    return;

  }


  /* NORMAL ADD */

  if(
    data.type==="add" &&
    host
  ){

    queue.push(
      data.id
    );


    if(!current)
      next();


    render();
    sync();

    return;

  }


  /* REMOVE */

  if(
    data.type==="remove" &&
    host
  ){

    remove(
      data.index
    );

    return;

  }


  /* BAJSOLLE CLASSICS */

  if(
    data.type==="classic" &&
    host
  ){

    startClassicShuffle();

    return;

  }


  /* CUSTOM CLASSIC */

  if(
    data.type==="classicAdd" &&
    host
  ){

    addClassicAndPlayById(
      data.id
    );

    return;

  }


  /* PLAY */

  if(
    data.type==="play"
  ){

    changing=true;


    player.seekTo(
      data.time,
      true
    );


    player.playVideo();


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* PAUSE */

  if(
    data.type==="pause"
  ){

    changing=true;


    player.seekTo(
      data.time,
      true
    );


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* VOLUME */

  if(
    data.type==="volume"
  ){

    player.setVolume(
      data.volume
    );


    document
      .getElementById("volume")
      .value=
      data.volume;


    return;

  }


  /* STATE REQUEST */

  if(
    data.type==="request" &&
    host
  ){

    sync();

  }

}


/* =====================================================
   CLOCK / DRIFT CORRECTION
===================================================== */

setInterval(()=>{

  if(
    !host ||
    !conn ||
    !conn.open ||
    !ready ||
    !current
  )
    return;


  send({

    type:"clock",

    time:
      player.getCurrentTime(),

    playing:
      player.getPlayerState()===
      YT.PlayerState.PLAYING

  });

},1000);


/* =====================================================
   RECEIVE CLOCK
===================================================== */

function clock(data){

  if(
    host ||
    !ready ||
    !current
  )
    return;


  let local=
    player.getCurrentTime();


  let drift=
    Math.abs(
      local-data.time
    );


  if(
    drift>0.5
  ){

    changing=true;


    player.seekTo(
      data.time,
      true
    );


    setTimeout(
      ()=>changing=false,
      300
    );

  }


  if(
    data.playing &&
    player.getPlayerState() !==
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.playVideo();


    setTimeout(
      ()=>changing=false,
      300
    );

  }


  if(
    !data.playing &&
    player.getPlayerState()===
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );

  }

}


/* =====================================================
   CONNECTION
===================================================== */

function setup(connection){

  conn=
    connection;


  connection.on(
    "open",
    ()=>{

      status(
        "Connected!"
      );


      if(host){

        sync();

      }else{

        send({
          type:"request"
        });

      }

    }
  );


  connection.on(
    "data",
    data=>{

      if(
        data.type===
        "clock"
      ){

        clock(data);

      }else{

        apply(data);

      }

    }
  );


  connection.on(
    "close",
    ()=>status(
      "Disconnected"
    )
  );

}


/* =====================================================
   PEER
===================================================== */

if(host){

  peer=
    new Peer(room);


  peer.on(
    "open",
    ()=>{

      status(
        "Room ready — share the URL"
      );

    }
  );


  peer.on(
    "connection",
    setup
  );


}else{

  peer=
    new Peer();


  peer.on(
    "open",
    ()=>{

      setup(
        peer.connect(room)
      );

    }
  );

}


/* =====================================================
   SHARE
===================================================== */

function share(){

  navigator.clipboard
    .writeText(
      location.href
    );


  status(
    "Room URL copied!"
  );

}


render();

</script>
