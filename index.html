/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("player",{

    width:"100%",
    height:"400",

    /*
      Start with a real blank/known player.
      The actual synchronized video is loaded later.
    */

    videoId:"",

    playerVars:{
      playsinline:1,
      controls:1,
      rel:0,
      origin:location.origin
    },

    events:{

      onReady:()=>{

        ready=true;

        player.setVolume(100);

        if(host){

          status(
            "Room ready — share the URL"
          );

          connectionStatus(
            "Host",
            "🟢"
          );

        }else{

          connectionStatus(
            "Connected — waiting for sync",
            "🟢"
          );

          /*
            Ask host for the current state
          */

          send({
            type:"request"
          });

        }

        /*
          If a state arrived before YouTube
          was ready, apply it now.
        */

        if(pendingState){

          let state=
            pendingState;

          pendingState=null;

          applyState(state);

        }

      },


      onStateChange:e=>{

        /*
          Ignore player events caused by
          our own synchronization commands.
        */

        if(changing)
          return;


        /*
          HOST controls the room.
          Users can still use play/pause,
          but the host broadcasts the state.
        */

        if(
          e.data===
          YT.PlayerState.PLAYING
        ){

          if(host){

            send({
              type:"play",
              time:player.getCurrentTime()
            });

          }

        }


        if(
          e.data===
          YT.PlayerState.PAUSED
        ){

          if(host){

            send({
              type:"pause",
              time:player.getCurrentTime()
            });

          }

        }


        /*
          Song finished.
        */

        if(
          e.data===
          YT.PlayerState.ENDED &&
          host
        ){

          next();

        }

      },


      /*
        Automatically skip videos that
        YouTube reports as unavailable.
      */

      onError:e=>{

        if(!host)
          return;

        if(!current)
          return;

        /*
          Prevent duplicate error handling.
        */

        if(lastErrorVideo===current)
          return;

        lastErrorVideo=current;

        clearTimeout(errorTimer);

        errorTimer=setTimeout(()=>{

          if(
            current &&
            queue[0]===current
          ){

            status(
              "Skipping unavailable YouTube video..."
            );

            queue.shift();

            current=null;

            next();

          }

          lastErrorVideo=null;

        },300);

      }

    }

  });

}


/* =====================================================
   GET YOUTUBE ID
===================================================== */

function getID(text){

  try{

    let u=new URL(text);


    if(
      u.hostname==="youtu.be" ||
      u.hostname==="www.youtu.be"
    ){

      return u.pathname.slice(1);

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      let v=
        u.searchParams.get("v");

      if(v)
        return v;


      let parts=
        u.pathname.split("/");


      if(
        parts[1]==="shorts" ||
        parts[1]==="embed" ||
        parts[1]==="live"
      ){

        return parts[2];

      }

    }

  }catch{}

  return null;

}


/* =====================================================
   NORMAL ADD
===================================================== */

function add(){

  let input=
    document.getElementById("url");

  let text=
    input.value.trim();


  if(!text)
    return;


  let id=
    getID(text);


  if(id){

    if(host){

      queue.push(id);

      if(!current)
        next();

      render();
      sync();

    }else{

      send({
        type:"add",
        id:id
      });

    }


    input.value="";

    return;

  }


  /*
    Search still opens YouTube search.
    A normal HTML page cannot reliably select
    a random YouTube result without the API.
  */

  window.open(

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(text),

    "_blank"

  );

}


/* =====================================================
   BAJSOLLE CLASSICS
===================================================== */

function playBajsolleClassic(){

  if(!host){

    if(!conn || !conn.open){

      status(
        "Not connected to host."
      );

      return;

    }


    send({
      type:"classic"
    });

    status(
      "Starting Bajsolle Classics..."
    );

    return;

  }


  startClassicShuffle();

}


/* =====================================================
   SHUFFLE CLASSICS
===================================================== */

function startClassicShuffle(){

  /*
    Create a fresh copy.
  */

  let shuffled=
    [...classics];


  /*
    Fisher-Yates shuffle.
  */

  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      shuffled[i],
      shuffled[j]
    ]=[
      shuffled[j],
      shuffled[i]
    ];

  }


  /*
    Replace queue with the
    complete randomized Classics list.
  */

  queue=[
    ...shuffled
  ];

  current=null;


  next();


  status(
    "🎵 Bajsolle Classics — "+
    shuffled.length+
    " songs shuffled"
  );

}

  if(!host){

      return;

    }


    send({

      type:"classicAdd",

      id:id

    });


    input.value="";

    return;

  }


  addClassicAndPlayById(id);

  input.value="";

}


/* =====================================================
   ADD CUSTOM CLASSIC BY ID
===================================================== */

function addClassicAndPlayById(id){

  if(
    !classics.includes(id)
  ){

    classics.push(id);

  }


  /*
    Put it directly after the
    currently playing song.
  */

  if(current){

    queue.splice(
      1,
      0,
      id
    );

  }else{

    queue.push(id);

    next();

  }


  render();
  sync();


  status(
    "Classic added — playing next."
  );

}

/* =====================================================
   REMOVE
===================================================== */

function remove(index){

  if(!host){

    if(!conn || !conn.open){

      status(
        "Not connected to host."
      );

      return;

    }


    send({

      type:"remove",

      index:index

    });

    return;

  }


  if(
    index<0 ||
    index>=queue.length
  )
    return;


  let wasCurrent=
    queue[index]===current;


  queue.splice(
    index,
    1
  );


  if(wasCurrent){

    current=null;

    next();

    return;

  }


  render();
  sync();

}


/* =====================================================
   NEXT SONG
===================================================== */

function next(){

  /*
    If the finished/current song is still
    at the front, remove it.

    Do NOT remove it when current=null,
    because that means we're starting
    a new queue.
  */

  if(
    current &&
    queue[0]===current
  ){

    queue.shift();

  }


  /*
    No songs left.
  */

  if(!queue.length){

    current=null;


    if(
      ready &&
      player
    ){

      changing=true;

      player.stopVideo();

      setTimeout(
        ()=>changing=false,
        300
      );

    }


    render();
    sync();

    return;

  }


  /*
    Next song is always queue[0].
  */

  current=
    queue[0];


  render();


  if(!ready || !player){

    sync();

    return;

  }


  loadCurrent(0);

}


/* =====================================================
   LOAD CURRENT VIDEO
===================================================== */

function loadCurrent(time){

  if(
    !ready ||
    !player ||
    !current
  )
    return;


  changing=true;


  player.loadVideoById({

    videoId:current,

    startSeconds:
      Number(time)||0

  });


  /*
    Keep changing=true long enough to ignore
    the load event caused by our command.
  */

  setTimeout(()=>{

    changing=false;

  },1000);


  sync();

}
