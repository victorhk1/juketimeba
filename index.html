/* =====================================================
   STATUS
===================================================== */

function status(text){

}


/* =====================================================
   CONNECTION STATUS
===================================================== */

function connectionStatus(){

  if(host){

    status(
      conn && conn.open
      ? "🟢 Connected — host"
      : "🟢 Room ready — share the URL"
    );

  }else{

    status(
      connected
      ? "🟢 Connected — synced"
      : "🟡 Connecting..."
    );

  }

}


/* =====================================================
   YOUTUBE
===================================================== */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("player",{

    width:"100%",
    height:"400",

    videoId:"",

    playerVars:{
      playsinline:1,
      controls:1,
      origin:location.origin
    },

    events:{

      onReady:()=>{

        ready=true;

        player.setVolume(100);

        connectionStatus();

      },


      onStateChange:e=>{

        if(changing)
          return;


        /* PLAY */

        if(
          e.data===
          YT.PlayerState.PLAYING
        ){

          send({

            type:"play",

            time:
              player.getCurrentTime()

          });

        }


        /* PAUSE */

        if(
          e.data===
          YT.PlayerState.PAUSED
        ){

          send({

            type:"pause",

            time:
              player.getCurrentTime()

          });

        }


        /* END */

        if(
          e.data===
          YT.PlayerState.ENDED &&
          host &&
          !skipInProgress
        ){

          next();

        }

      },


      /* =================================================
         AUTOMATICALLY SKIP BAD YOUTUBE VIDEOS
      ================================================= */

      onError:e=>{

        const bad=[

          2,    // invalid ID
          5,    // HTML5 error
          100,  // unavailable/deleted/private
          101,  // embedding disabled
          150,  // embedding disabled
          153   // player request error

        ];


        if(
          host &&
          current &&
          bad.includes(e.data)
        ){

          skipUnavailable();

        }else{

          status(
            "YouTube error: "+e.data
          );

        }

      }

    }

  });

}


/* =====================================================
   SKIP UNAVAILABLE VIDEO
===================================================== */

function skipUnavailable(){

  if(skipInProgress)
    return;

  skipInProgress=true;


  status(
    "⏭️ Skipping unavailable video..."
  );


  /*
    Remove current song from queue.
  */

  if(
    queue.length &&
    queue[0]===current
  ){

    queue.shift();

  }else{

    let i=
      queue.indexOf(current);

    if(i>=0)
      queue.splice(i,1);

  }


  current=null;


  render();


  /*
    Give YouTube a moment before loading
    the next video.
  */

  setTimeout(()=>{

    skipInProgress=false;

    next();

  },300);

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function getID(text){

  try{

    let u=new URL(text);


    if(
      u.hostname==="youtu.be" ||
      u.hostname==="www.youtu.be"
    ){

      return u.pathname.slice(1);

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.searchParams.get("v")
      ){

        return u.searchParams.get("v");

      }


      let parts=
        u.pathname.split("/");


      if(
        parts[1]==="shorts" ||
        parts[1]==="embed" ||
        parts[1]==="live"
      ){

        return parts[2];

      }

    }

  }catch{}

  return null;

}


/* =====================================================
   ADD NORMAL SONG
===================================================== */

function add(){

  let input=
    document.getElementById("url");

  let text=
    input.value.trim();


  if(!text)
    return;


  let id=
    getID(text);


  if(id){

    if(host){

      queue.push(id);


      if(!current)
        next();


      render();
      sync();

    }else{

      if(!connected){

        status(
          "Not connected yet."
        );

        return;

      }


      send({

        type:"add",

        id:id

      });

    }


    input.value="";

    return;

  }


  window.open(

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(text),

    "_blank"

  );

}


/* =====================================================
   BAJSOLLE BUTTON
===================================================== */

function playBajsolleClassic(){

  if(!host){

    if(!connected){

      status(
        "Not connected yet."
      );

      return;

    }


    send({
      type:"classic"
    });


    status(
      "🎵 Starting Bajsolle Classics..."
    );


    return;

  }


  startClassicShuffle();

}


/* =====================================================
   SHUFFLE CLASSICS
===================================================== */

function startClassicShuffle(){

  let shuffled=
    [...classics];


  /* Fisher-Yates */

  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      shuffled[i],
      shuffled[j]
    ]=[
      shuffled[j],
      shuffled[i]
    ];

  }


  /*
    Replace entire queue.
    This means one click starts
    a complete randomized Classics
    playlist.
  */

  queue=
    shuffled;


  current=null;


  render();


  next();


  status(
    "🎵 Bajsolle Classics — "+
    shuffled.length+
    " songs shuffled"
  );

}


/* =====================================================
   CUSTOM CLASSIC
===================================================== */

function addClassicAndPlay(){

  let input=
    document.getElementById("classicUrl");


  let id=
    getID(
      input.value.trim()
    );


  if(!id){

    status(
      "Please enter a valid YouTube URL."
    );

    return;

  }


  if(!host){

    if(!connected){

      status(
        "Not connected yet."
      );

      return;

    }


    send({

      type:"classicAdd",

      id:id

    });


    input.value="";

    return;

  }


  addClassicAndPlayById(id);

  input.value="";

}


/* =====================================================
   CUSTOM CLASSIC -> NEXT
===================================================== */

function addClassicAndPlayById(id){

  if(
    !classics.includes(id)
  ){

    classics.push(id);

  }


  /*
    Put the new Classic immediately
    after the currently playing song.
  */

  if(current){

    queue.splice(
      1,
      0,
      id
    );

  }else{

    queue.push(id);

    next();

  }


  render();
  sync();


  status(
    "Classic added — playing next."
  );

}


/* =====================================================
   RANDOM YOUTUBE
===================================================== */

function randomYouTube(){

  const searches=[

    "random music",
    "random rock music",
    "random country music",
    "random pop music",
    "random electronic music",
    "random metal music",
    "random indian music",
    "random mexican music",
    "random swedish music",
    "random balkan music",
    "random 90s music",
    "random 2000s music"

  ];


  let query=
    searches[
      Math.floor(
        Math.random()*searches.length
      )
    ];

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(query),

    "_blank"

  );

}


/* =====================================================
   REMOVE
===================================================== */

function remove(index){

  if(!host){

    if(!connected)
      return;


    send({

      type:"remove",

      index:index

    });

    return;

  }


  if(
    index<0 ||
    index>=queue.length
  )
    return;


  let wasCurrent=
    queue[index]===current;


  queue.splice(
    index,
    1
  );


  if(wasCurrent){

    current=null;

    next();

    return;

  }


  render();
  sync();

}


/* =====================================================
   NEXT SONG
===================================================== */

function next(){

  if(skipInProgress)
    return;


  /*
    Remove the song that just finished.
  */

  if(
    current &&
    queue[0]===current
  ){

    queue.shift();

  }


  /*
    Queue empty.
  */

  if(!queue.length){

    current=null;


    if(ready)
      player.stopVideo();


    render();
    sync();


    status(
      "Queue empty."
    );


    return;

  }


  /*
    First item is now the next song.
  */

  current=
    queue[0];


  changing=true;


  player.loadVideoById(
    current
  );


  render();
  sync();


  /*
    YouTube normally starts the video
    automatically for the host because
    the action originated from the user's
    interaction / existing playback.
  */

  setTimeout(()=>{

    changing=false;

  },800);

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  document
    .getElementById("queue")
    .innerHTML=

    queue.map((id,i)=>`

      <div class="item">

        <span>

          ${
            i===0 &&
            id===current
            ? "▶ "
            : ""
          }

          ${i+1}. ${id}

        </span>

        <button
          onclick="remove(${i})"
        >
          ×
        </button>

      </div>

    `).join("");

}


/* =====================================================
   ENABLE PLAYBACK
===================================================== */

function enablePlayback(){

  if(!ready)
    return;


  /*
    This is a real user interaction,
    allowing the browser to permit
    YouTube playback.
  */

  changing=true;


  if(current){

    player.playVideo();

  }


  setTimeout(()=>{

    changing=false;

  },500);


  document
    .getElementById("enablePlayback")
    .style.display="none";


  if(connected){

    send({

      type:"request"

    });

  }

}


/* =====================================================
   VOLUME
===================================================== */

document
  .getElementById("volume")
  .oninput=function(){

    let value=
      Number(this.value);


    if(ready)
      player.setVolume(value);


    send({

      type:"volume",

      volume:value

    });

  };


/* =====================================================
   SEND
===================================================== */

function send(data){

  if(
    conn &&
    conn.open
  ){

    conn.send(data);

  }

}


/* =====================================================
   FULL STATE
===================================================== */

function sync(){

  if(
    !host ||
    !conn ||
    !conn.open
  )
    return;


  send({

    type:"state",

    queue:[
      ...queue
    ],

    current:current,

    time:
      ready && current
      ? player.getCurrentTime()
      : 0,

    playing:
      ready &&
      current &&
      player.getPlayerState()===
      YT.PlayerState.PLAYING,

    volume:
      ready
      ? player.getVolume()
      : 100

  });

}


/* =====================================================
   APPLY STATE
===================================================== */

function apply(data){


  /* =================================================
     FULL STATE
  ================================================= */

  if(
    data.type==="state"
  ){

    queue=
      data.queue || [];


    render();


    if(
      data.volume!=null
    ){

      player.setVolume(
        data.volume
      );


      document
        .getElementById("volume")
        .value=
        data.volume;

    }


    /*
      Different song.
    */

    if(
      data.current!==current
    ){

      current=
        data.current;


      if(current){

        changing=true;


        player.loadVideoById(
          current,
          data.time || 0
        );


        setTimeout(()=>{

          changing=false;


          /*
            Try autoplay.
            If the browser blocks it,
            the user can click Enable Playback.
          */

          if(data.playing){

            player.playVideo();


            setTimeout(()=>{

              if(
                player.getPlayerState() !==
                YT.PlayerState.PLAYING
              ){

                document
                  .getElementById("enablePlayback")
                  .style.display="inline-block";

              }

            },1000);

          }

        },800);

      }

    }else if(current){

      changing=true;


      player.seekTo(
        data.time || 0,
        true
      );


      if(data.playing){

        player.playVideo();

      }else{

        player.pauseVideo();

      }


      setTimeout(
        ()=>changing=false,
        300
      );

    }


    return;

  }


  /* =================================================
     NORMAL ADD
  ================================================= */

  if(
    data.type==="add" &&
    host
  ){

    queue.push(
      data.id
    );


    if(!current)
      next();


    render();
    sync();


    return;

  }


  /* =================================================
     REMOVE
  ================================================= */

  if(
    data.type==="remove" &&
    host
  ){

    remove(
      data.index
    );


    return;

  }


  /* =================================================
     BAJSOLLE CLASSICS
  ================================================= */

  if(
    data.type==="classic" &&
    host
  ){

    startClassicShuffle();


    return;

  }


  /* =================================================
     CUSTOM CLASSIC
  ================================================= */

  if(
    data.type==="classicAdd" &&
    host
  ){

    addClassicAndPlayById(
      data.id
    );


    return;

  }


  /* =================================================
     PLAY
  ================================================= */

  if(
    data.type==="play"
  ){

    if(!ready)
      return;


    changing=true;


    player.seekTo(
      data.time,
      true
    );


    player.playVideo();


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* =================================================
     PAUSE
  ================================================= */

  if(
    data.type==="pause"
  ){

    if(!ready)
      return;


    changing=true;


    player.seekTo(
      data.time,
      true
    );


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* =================================================
     VOLUME
  ================================================= */

  if(
    data.type==="volume"
  ){

    if(!ready)
      return;


    player.setVolume(
      data.volume
    );


    document
      .getElementById("volume")
      .value=
      data.volume;


    return;

  }


  /* =================================================
     STATE REQUEST
  ================================================= */

  if(
    data.type==="request" &&
    host
  ){

    sync();

  }

}


/* =====================================================
   DRIFT CORRECTION
===================================================== */

setInterval(()=>{

  if(
    !host ||
    !conn ||
    !conn.open ||
    !ready ||
    !current
  )
    return;


  send({

    type:"clock",

    time:
      player.getCurrentTime(),

    playing:
      player.getPlayerState()===
      YT.PlayerState.PLAYING

  });

},1000);


/* =====================================================
   RECEIVE CLOCK
===================================================== */

function clock(data){

  if(
    host ||
    !ready ||
    !current ||
    !connected
  )
    return;


  let local=
    player.getCurrentTime();


  let drift=
    Math.abs(
      local-data.time
    );


  /*
    Correct significant drift.
  */

  if(
    drift>0.5
  ){

    changing=true;


    player.seekTo(
      data.time,
      true
    );


    setTimeout(
      ()=>changing=false,
      300
    );

  }


  /*
    Correct play state.
  */

  if(
    data.playing &&
    player.getPlayerState() !==
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.playVideo();


    setTimeout(()=>{

      changing=false;


      /*
        Browser may block autoplay.
      */

      if(
        player.getPlayerState() !==
        YT.PlayerState.PLAYING
      ){

        document
          .getElementById("enablePlayback")
          .style.display="inline-block";

      }

    },700);

  }


  /*
    Correct pause state.
  */

  if(
    !data.playing &&
    player.getPlayerState()===
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );

  }

}


/* =====================================================
   CONNECTION
===================================================== */

function setup(connection){

  conn=
    connection;


  connection.on(
    "open",
    ()=>{

      connected=true;


      connectionStatus();


      /*
        Host sends state.
      */

      if(host){

        sync();

      }else{

        /*
          User 2 asks host for current state.
        */

        send({

          type:"request"

        });

      }

    }
  );


  connection.on(
    "data",
    data=>{

      if(
        data.type===
        "clock"
      ){

        clock(data);

      }else{

        apply(data);

      }

    }
  );


  connection.on(
    "close",
    ()=>{

      connected=false;

      connectionStatus();

    }
  );


  connection.on(
    "error",
    ()=>{

      connected=false;

      status(
        "🔴 Connection error"
      );

    }
  );

}

    new Peer(room);


  peer.on(
    "open",
    ()=>{

      connectionStatus();

    }
  );


  peer.on(
    "connection",
    setup
  );


}else{

  peer=
    new Peer();


  peer.on(
    "open",
    ()=>{

      setup(
        peer.connect(room)
      );

    }
  );

}


/* =====================================================
   SHARE
===================================================== */

function share(){

  navigator.clipboard
    .writeText(
      location.href
    );


  status(
    "Room URL copied!"
  );

}


/* =====================================================
   INITIAL RENDER
===================================================== */

render();

</script>

</html>
