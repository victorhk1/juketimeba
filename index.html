/* =====================================================
   STATUS
===================================================== */

function setStatus(text, state){
  document.getElementById("status").textContent=text;

  if(state){
    connState=state;
  }

  let badge=document.getElementById("connBadge");
  badge.className="conn-status "+connState;

  const labels={
    pending:"Pending",
    connected:"Connected",
    disconnected:"Disconnected",
    reconnecting:"Reconnecting..."
  };
  badge.textContent=labels[connState]||connState;
}


/* =====================================================
   YOUTUBE PLAYER
===================================================== */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("player",{

    width:"100%",
    height:"400",

    videoId:"",

    playerVars:{
      playsinline:1,
      controls:1
    },

    events:{

      onReady:()=>{

        ready=true;
        player.setVolume(100);

        if(host){

          playbackEnabled=true;
          setStatus("Room ready — share the URL","connected");

        }else{

          if(conn && conn.open){
            send({type:"request"});
            setStatus("Connected — waiting for video...","connected");
          }else{
            pendingRequest=true;
            setStatus("Waiting for host...","pending");
          }

          if(lastState){
            apply(lastState);
          }

        }

      },


      onStateChange:e=>{

        if(changing)
          return;

        if(e.data===YT.PlayerState.PLAYING){
          send({type:"play",time:player.getCurrentTime()});
        }

        if(e.data===YT.PlayerState.PAUSED){
          send({type:"pause",time:player.getCurrentTime()});
        }

        if(e.data===YT.PlayerState.ENDED && host){
          next();
        }

      },


      onError:e=>{

        if(
          host &&
          current &&
          (e.data===100||e.data===101||e.data===150||e.data===2)
        ){

          setStatus("Skipping unavailable video...","connected");
          skipBrokenCurrent();

        }else if(e.data===2){

          if(!host){
            setStatus("Waiting for valid video...","connected");
          }else{
            setStatus("YouTube error: "+e.data,"connected");
          }

        }else{

          setStatus("YouTube error: "+e.data, connState);

        }

      }

    }

  });

}


/* =====================================================
   GET VIDEO ID
===================================================== */

function getID(text){

  try{

    let u=new URL(text);

    if(u.hostname==="youtu.be"||u.hostname==="www.youtu.be"){
      return u.pathname.slice(1);
    }

    if(u.hostname.includes("youtube.com")){

      if(u.searchParams.get("v")){
        return u.searchParams.get("v");
      }

      let parts=u.pathname.split("/");

      if(parts[1]==="shorts"||parts[1]==="embed"||parts[1]==="live"){
        return parts[2];
      }

    }

  }catch{}

  return null;

}


/* =====================================================
   ADD / SEARCH
===================================================== */

function add(){

  let input=document.getElementById("url");
  let text=input.value.trim();

  if(!text) return;

  let id=getID(text);

  if(id){

    if(host){
      queue.push(id);
      if(!current) next();
      render();
      sync();
    }else{
      send({type:"add",id:id});
    }

    input.value="";
    return;

  }

  window.open(
    "https://www.youtube.com/results?search_query="+encodeURIComponent(text),
    "_blank"
  );

}


/* =====================================================
   BAJSOLLE CLASSICS
===================================================== */

function playBajsolleClassic(){

  if(!host){
    send({type:"classic"});
    setStatus("Requesting Bajsolle Classics...","connected");
    return;
  }

  startClassicShuffle();

}


function startClassicShuffle(){

  let shuffled=[...classics];

  for(let i=shuffled.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
  }

  queue=[...shuffled];
  current=null;
  next();

  setStatus("🎵 Bajsolle Classics — "+shuffled.length+" songs shuffled","connected");

}


/* =====================================================
   ADD CLASSIC + PLAY NEXT
===================================================== */

function addClassicAndPlay(){

  let input=document.getElementById("classicUrl");
  let id=getID(input.value.trim());

  if(!id){
    setStatus("Please enter a valid YouTube URL.","connected");
    return;
  }

  if(!host){
    send({type:"classicAdd",id:id});
    input.value="";
    return;
  }

  addClassicAndPlayById(id);
  input.value="";

}


function addClassicAndPlayById(id){

  if(!classics.includes(id)){
    classics.push(id);
  }

  if(current){
    let index=queue.indexOf(current);
    if(index>=0){
      queue.splice(index+1,0,id);
    }else{
      queue.push(id);
    }
  }else{
    queue.push(id);
    next();
  }

  render();
  sync();
  setStatus("Classic added — playing next.","connected");

}

function randomYouTube(){

/* =====================================================
   REMOVE
===================================================== */

function remove(index){

  if(!host){
    send({type:"remove",index:index});
    return;
  }

  if(index<0||index>=queue.length) return;

  let wasCurrent=queue[index]===current;
  queue.splice(index,1);

  if(wasCurrent){
    current=null;
    next();
    return;
  }

  render();
  sync();

}


/* =====================================================
   SKIP BROKEN
===================================================== */

function skipBrokenCurrent(){

  if(!host) return;

  if(queue.length&&queue[0]===current){
    queue.shift();
  }else{
    let index=queue.indexOf(current);
    if(index>=0) queue.splice(index,1);
  }

  current=null;
  next();

}


/* =====================================================
   NEXT
===================================================== */

function next(){

  if(current&&queue.length&&queue[0]===current){
    queue.shift();
  }

  if(!queue.length){
    current=null;
    if(ready) player.stopVideo();
    render();
    sync();
    return;
  }

  current=queue[0];
  render();

  if(ready){
    changing=true;

    if(current&&current.length>0){
      player.loadVideoById(current,0);
    }

    setTimeout(()=>{
      changing=false;
      if(host&&playbackEnabled){
        player.playVideo();
      }
    },700);
  }

  sync();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  document
    .getElementById("queue")
    .innerHTML=

    queue.map((id,i)=>{

      let label=videoLabels[id]||"🎵 Custom";

      return `

      <div class="item">

        <span class="item-label">

          ${i===0&&id===current?"▶ ":""}
          ${i+1}. ${label}

        </span>

        <button onclick="remove(${i})">
          ×
        </button>

      </div>

    `;

    }).join("");

}


/* =====================================================
   ENABLE PLAYBACK
===================================================== */

function enablePlayback(){

  if(host||!ready||!current) return;

  playbackEnabled=true;
  changing=true;
  player.playVideo();

  setTimeout(()=>{changing=false;},500);

  document
    .getElementById("enablePlayback")
    .style.display="none";

  setStatus("Playback enabled — syncing...","connected");
  send({type:"request"});

}


/* =====================================================
   VOLUME
===================================================== */

document
  .getElementById("volume")
  .oninput=function(){

    let value=Number(this.value);
    if(ready) player.setVolume(value);
    send({type:"volume",volume:value});

  };


/* =====================================================
   SEND
===================================================== */

function send(data){

  if(conn&&conn.open){
    try{
      conn.send(data);
    }catch{}
  }

}


/* =====================================================
   SYNC
===================================================== */

function sync(){

  send({
    type:"state",
    queue:[...queue],
    current:current,
    time:
      ready&&current
      ? player.getCurrentTime()
      : 0,
    playing:
      ready&&current&&
      player.getPlayerState()===YT.PlayerState.PLAYING,
    volume:
      ready?player.getVolume():100
  });

}


/* =====================================================
   APPLY STATE
===================================================== */

function apply(data){

  if(data.type==="state"){

    lastState=data;
    queue=data.queue||[];
    render();

    if(data.volume!=null&&ready){
      player.setVolume(data.volume);
      document.getElementById("volume").value=data.volume;
    }

    if(!data.current){
      current=null;
      if(ready) player.stopVideo();
      return;
    }

    if(!ready){
      current=data.current;
      return;
    }

    let actualVideo=player.getVideoData().video_id||"";

    if(!data.current||data.current.length===0) return;

    if(actualVideo!==data.current){

      current=data.current;
      changing=true;

      player.loadVideoById(data.current,data.time||0);

      setTimeout(()=>{

        changing=false;

        if(data.playing&&playbackEnabled){
          player.playVideo();
        }

        if(
          !host&&
          data.playing&&
          player.getPlayerState()!==YT.PlayerState.PLAYING
        ){

          document
            .getElementById("enablePlayback")
            .style.display="inline-block";

          setStatus("Click Enable Playback to start.","connected");

        }

      },900);

    }else{

      current=data.current;
      changing=true;
      player.seekTo(data.time||0,true);

      if(data.playing&&playbackEnabled){
        player.playVideo();
      }else{
        player.pauseVideo();
      }

      setTimeout(()=>changing=false,300);

    }

    return;

  }


  if(data.type==="add"&&host){
    queue.push(data.id);
    if(!current) next();
    render();
    sync();
    return;
  }

  if(data.type==="remove"&&host){
    remove(data.index);
    return;
  }

  if(data.type==="classic"&&host){
    startClassicShuffle();
    return;
  }

  if(data.type==="classicAdd"&&host){
    addClassicAndPlayById(data.id);
    return;
  }

  if(data.type==="play"){
    if(!ready) return;
    changing=true;
    player.seekTo(data.time||0,true);
    if(host||playbackEnabled) player.playVideo();
    setTimeout(()=>changing=false,300);
    return;
  }

  if(data.type==="pause"){
    if(!ready) return;
    changing=true;
    player.seekTo(data.time||0,true);
    player.pauseVideo();
    setTimeout(()=>changing=false,300);
    return;
  }

  if(data.type==="volume"){
    if(!ready) return;
    player.setVolume(data.volume);
    document.getElementById("volume").value=data.volume;
    return;
  }

  if(data.type==="request"&&host){
    sync();
  }

}


/* =====================================================
   DRIFT CORRECTION
===================================================== */

setInterval(()=>{

  if(!host||!conn||!conn.open||!ready||!current) return;

  send({
    type:"clock",
    time:player.getCurrentTime(),
    playing:player.getPlayerState()===YT.PlayerState.PLAYING
  });

},1000);


/* =====================================================
   RECEIVE CLOCK
===================================================== */

function clock(data){

  if(host||!ready||!current||!playbackEnabled) return;

  let local=player.getCurrentTime();
  let drift=Math.abs(local-data.time);

  if(drift>0.5){
    changing=true;
    player.seekTo(data.time,true);
    setTimeout(()=>changing=false,300);
  }

  if(data.playing&&player.getPlayerState()!==YT.PlayerState.PLAYING){
    changing=true;
    player.playVideo();
    setTimeout(()=>changing=false,300);
  }

  if(!data.playing&&player.getPlayerState()===YT.PlayerState.PLAYING){
    changing=true;
    player.pauseVideo();
    setTimeout(()=>changing=false,300);
  }

}


/* =====================================================
   CONNECTION SETUP
===================================================== */

function setup(connection){

  conn=connection;

  connection.on("open",()=>{

    setStatus("Connected!","connected");
    reconnectAttempts=0;

    if(host){
      sync();
    }else{
      if(pendingRequest){
        pendingRequest=false;
      }
      send({type:"request"});
    }

  });

  connection.on("data",data=>{
    if(data.type==="clock"){
      clock(data);
    }else{
      apply(data);
    }
  });

  connection.on("close",()=>{

    conn=null;

    if(host){
      setStatus("Guest disconnected.","connected");
    }else{
      setStatus("Disconnected from host.","disconnected");
      scheduleReconnect();
    }

  });

  connection.on("error",e=>{
    console.error("PeerJS connection error:",e);
    if(!host){
      setStatus("Connection error.","disconnected");
      scheduleReconnect();
    }
  });

}


/* =====================================================
   RECONNECT
===================================================== */

function scheduleReconnect(){

  if(host) return;

  if(reconnectAttempts>=MAX_RECONNECT){
    setStatus("Failed to reconnect. Refresh page.","disconnected");
    return;
  }

  connState="reconnecting";
  let badge=document.getElementById("connBadge");
  badge.className="conn-status reconnecting";
  badge.textContent="Reconnecting...";

  let delay=2000*(reconnectAttempts+1);
  reconnectAttempts++;

  reconnectTimer=setTimeout(()=>{
    try{
      if(peer&&peer.open){
        let newConn=peer.connect(room,{reliable:true});
        setup(newConn);
      }
    }catch(e){
      console.error("Reconnect failed:",e);
      scheduleReconnect();
    }
  },delay);

}


/* =====================================================
   PEER INIT
===================================================== */

if(host){

  setStatus("Starting room...","pending");

  peer=new Peer(room);

  peer.on("open",()=>{
    setStatus("Room ready — share the URL","connected");
  });

  peer.on("connection",setup);

  peer.on("error",e=>{
    console.error("Peer error:",e);
    setStatus("Peer error: "+e.type,"disconnected");
  });

  peer.on("disconnected",()=>{
    try{peer.reconnect();}catch{}
  });

}else{

  setStatus("Connecting to room...","pending");

  peer=new Peer();

  peer.on("open",()=>{
    let connection=peer.connect(room,{reliable:true});
    setup(connection);
  });

  peer.on("error",e=>{
    console.error("Peer error:",e);

    if(e.type==="peer-unavailable"){
      setStatus("Room not found. Check the URL.","disconnected");
    }else{
      setStatus("Connection error: "+e.type,"disconnected");
    }
  });

  peer.on("disconnected",()=>{
    try{peer.reconnect();}catch{}
  });

}


/* =====================================================
   SHARE
===================================================== */

function share(){

  navigator.clipboard.writeText(location.href);
  setStatus("Room URL copied!","connected");

}


render();

</script>
