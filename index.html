/* =====================================================
   YOUTUBE
===================================================== */

function onYouTubeIframeAPIReady(){

  player=new YT.Player("player",{

    width:"100%",
    height:"400",

    /*
      Empty player is fine.
      We explicitly load videos when state arrives.
    */

    videoId:"",

    playerVars:{
      playsinline:1,
      controls:1,
      origin:location.origin
    },

    events:{

      onReady:()=>{

        ready=true;

        player.setVolume(100);

        if(host){

          playbackEnabled=true;

          status(
            "Room ready — share the URL"
          );

        }else{

          status(
            "Connected — waiting for video..."
          );

          /*
            Ask host for the current state again.
          */

          send({
            type:"request"
          });

        }

      },


      onStateChange:e=>{

        /*
          Ignore state changes caused by our
          synchronization commands.
        */

        if(changing)
          return;


        /*
          PLAY
        */

        if(
          e.data===
          YT.PlayerState.PLAYING
        ){

          send({

            type:"play",

            time:
              player.getCurrentTime()

          });

        }


        /*
          PAUSE
        */

        if(
          e.data===
          YT.PlayerState.PAUSED
        ){

          send({

            type:"pause",

            time:
              player.getCurrentTime()

          });

        }


        /*
          SONG FINISHED
        */

        if(
          e.data===
          YT.PlayerState.ENDED &&
          host
        ){

          next();

        }

      },


      /*
        Automatically skip unavailable videos.

        100 = unavailable
        101 = embedding prohibited
        150 = embedding prohibited
      */

      onError:e=>{

        if(
          host &&
          current &&
          (
            e.data===100 ||
            e.data===101 ||
            e.data===150 ||
            e.data===2
          )
        ){

          status(
            "Skipping unavailable video..."
          );

          skipBrokenCurrent();

        }else{

          status(
            "YouTube error: "+e.data
          );

        }

      }

    }

  });

}


/* =====================================================
   GET VIDEO ID
===================================================== */

function getID(text){

  try{

    let u=new URL(text);

    if(
      u.hostname==="youtu.be" ||
      u.hostname==="www.youtu.be"
    ){

      return u.pathname.slice(1);

    }


    if(
      u.hostname.includes("youtube.com")
    ){

      if(
        u.searchParams.get("v")
      ){

        return u.searchParams.get("v");

      }


      let parts=
        u.pathname.split("/");


      if(
        parts[1]==="shorts" ||
        parts[1]==="embed" ||
        parts[1]==="live"
      ){

        return parts[2];

      }

    }

  }catch{}

  return null;

}


/* =====================================================
   NORMAL ADD
===================================================== */

function add(){

  let input=
    document.getElementById("url");

  let text=
    input.value.trim();


  if(!text)
    return;


  let id=
    getID(text);


  if(id){

    if(host){

      queue.push(id);

      if(!current)
        next();

      render();
      sync();

    }else{

      send({

        type:"add",

        id:id

      });

    }


    input.value="";

    return;

  }


  window.open(

    "https://www.youtube.com/results?search_query="+
    encodeURIComponent(text),

    "_blank"

  );

}


/* =====================================================

function playBajsolleClassic(){

/* =====================================================
   START SHUFFLED CLASSICS
===================================================== */

function startClassicShuffle(){

  /*
    Fisher-Yates shuffle.
  */

  let shuffled=
    [...classics];


  for(
    let i=shuffled.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*(i+1)
      );


    [
      shuffled[i],
      shuffled[j]
    ]=[
      shuffled[j],
      shuffled[i]
    ];

  }


  /*
    Replace the queue.

    This means one click creates the
    complete randomized playlist.
  */

  queue=[
    ...shuffled
  ];


  current=null;


  /*
    Start first song.
  */

  next();


  status(
    "🎵 Bajsolle Classics — "+
    shuffled.length+
    " songs shuffled"
  );

}

/* =====================================================
   CUSTOM CLASSIC
===================================================== */

function addClassicAndPlayById(id){

  /*
    Add to Classics permanently for
    this page/session.
  */

  if(
    !classics.includes(id)
  ){

    classics.push(id);

  }


  /*
    Put it immediately after the
    currently playing song.
  */

  if(current){

    let index=
      queue.indexOf(current);


    if(index>=0){

      queue.splice(
        index+1,
        0,
        id
      );

    }else{

      queue.push(id);

    }

  }else{

    queue.push(id);

    next();

  }


  render();
  sync();


  status(
    "Classic added — playing next."
  );

}

/* =====================================================
   REMOVE
===================================================== */

function remove(index){

  if(!host){

    send({

      type:"remove",

      index:index

    });

    return;

  }


  if(
    index<0 ||
    index>=queue.length
  )
    return;


  let wasCurrent=
    queue[index]===current;


  queue.splice(
    index,
    1
  );


  if(wasCurrent){

    current=null;

    next();

    return;

  }


  render();
  sync();

}


/* =====================================================
   SKIP BROKEN VIDEO
===================================================== */

function skipBrokenCurrent(){

  if(!host)
    return;


  /*
    Remove the broken current song
    from the front of the queue.
  */

  if(
    queue.length &&
    queue[0]===current
  ){

    queue.shift();

  }else{

    let index=
      queue.indexOf(current);

    if(index>=0)
      queue.splice(index,1);

  }


  current=null;


  /*
    Move directly to the next song.
  */

  next();

}


/* =====================================================
   NEXT SONG
===================================================== */

function next(){

  /*
    If the current song is still at
    the front, remove it.

    This happens when a video naturally
    finishes.
  */

  if(
    current &&
    queue.length &&
    queue[0]===current
  ){

    queue.shift();

  }


  /*
    No songs left.
  */

  if(!queue.length){

    current=null;


    if(ready)
      player.stopVideo();


    render();
    sync();

    return;

  }


  /*
    Next song is always queue[0].
  */

  current=
    queue[0];


  render();


  /*
    Load the video.

    Host is authoritative.
  */

  if(ready){

    changing=true;


    player.loadVideoById(
      current,
      0
    );


    setTimeout(()=>{

      changing=false;

      /*
        Host should autoplay.
      */

      if(
        host &&
        playbackEnabled
      ){

        player.playVideo();

      }

    },700);

  }


  sync();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

  document
    .getElementById("queue")
    .innerHTML=

    queue.map((id,i)=>`

      <div class="item">

        <span>

          ${
            i===0 &&
            id===current
            ? "▶ "
            : ""
          }

          ${i+1}. ${id}

        </span>

        <button
          onclick="remove(${i})"
        >
          ×
        </button>

      </div>

    `).join("");

}


/* =====================================================
   ENABLE PLAYBACK
===================================================== */

function enablePlayback(){

  if(
    host ||
    !ready ||
    !current
  )
    return;


  playbackEnabled=true;

  changing=true;


  /*
    User interaction allows the browser
    to start the YouTube player.
  */

  player.playVideo();


  setTimeout(()=>{

    changing=false;

  },500);


  document
    .getElementById("enablePlayback")
    .style.display="none";


  status(
    "Playback enabled — syncing..."
  );


  send({

    type:"request"

  });

}

/* =====================================================
   SEND
===================================================== */

function send(data){

  if(
    conn &&
    conn.open
  ){

    try{

      conn.send(data);

    }catch{}

  }

}


/* =====================================================
   FULL STATE
===================================================== */

function sync(){

  if(
    !host ||
    !ready
  ){

    /*
      Still allow state requests etc.
      No action needed.
    */

  }


  send({

    type:"state",

    queue:[
      ...queue
    ],

    current:current,

    time:
      ready && current
      ? player.getCurrentTime()
      : 0,

    playing:
      ready &&
      current &&
      player.getPlayerState()===
      YT.PlayerState.PLAYING,

    volume:
      ready
      ? player.getVolume()
      : 100

  });

}


/* =====================================================
   APPLY STATE
===================================================== */

function apply(data){


  /* ===============================================
     FULL STATE
  =============================================== */

  if(
    data.type==="state"
  ){

    /*
      Store queue first.
    */

    queue=
      data.queue || [];


    render();


    /*
      Volume.
    */

    if(
      data.volume!=null &&
      ready
    ){

      player.setVolume(
        data.volume
      );


      document
        .getElementById("volume")
        .value=
        data.volume;

    }


    /*
      No current video.
    */

    if(!data.current){

      current=null;

      if(ready)
        player.stopVideo();

      return;

    }


    /*
      IMPORTANT:

      Always load the host's video if
      our player doesn't currently have it.

      This avoids the User 2 problem where
      current was already set but the YouTube
      iframe never actually loaded it.
    */

    let actualVideo=
      ready
      ? player.getVideoData().video_id
      : "";


    if(
      !ready
    ){

      /*
        Player isn't ready yet.

        Keep current stored. onReady()
        will request state again.
      */

      current=
        data.current;

      return;

    }


    if(
      actualVideo !==
      data.current
    ){

      current=
        data.current;


      changing=true;


      player.loadVideoById(
        data.current,
        data.time || 0
      );


      setTimeout(()=>{

        changing=false;


        /*
          Host says it is playing.
        */

        if(
          data.playing &&
          playbackEnabled
        ){

          player.playVideo();

        }


        /*
          If autoplay was blocked,
          show the button for User 2.
        */

        if(
          !host &&
          data.playing &&
          player.getPlayerState() !==
          YT.PlayerState.PLAYING
        ){

          document
            .getElementById("enablePlayback")
            .style.display="inline-block";

          status(
            "Click Enable Playback to start."
          );

        }

      },900);


    }else{

      /*
        Same video is already loaded.

        Just correct the position and
        play state.
      */

      current=
        data.current;


      changing=true;


      player.seekTo(
        data.time || 0,
        true
      );


      if(
        data.playing &&
        playbackEnabled
      ){

        player.playVideo();

      }else{

        player.pauseVideo();

      }


      setTimeout(
        ()=>changing=false,
        300
      );

    }


    return;

  }


  /* ===============================================
     NORMAL ADD
  =============================================== */

  if(
    data.type==="add" &&
    host
  ){

    queue.push(
      data.id
    );


    if(!current)
      next();


    render();
    sync();

    return;

  }


  /* ===============================================
     REMOVE
  =============================================== */

  if(
    data.type==="remove" &&
    host
  ){

    remove(
      data.index
    );

    return;

  }


  /* ===============================================
     BAJSOLLE CLASSICS
  =============================================== */

  if(
    data.type==="classic" &&
    host
  ){

    startClassicShuffle();

    return;

  }


  /* ===============================================
     CUSTOM CLASSIC
  =============================================== */

  if(
    data.type==="classicAdd" &&
    host
  ){

    addClassicAndPlayById(
      data.id
    );

    return;

  }


  /* ===============================================
     PLAY
  =============================================== */

  if(
    data.type==="play"
  ){

    if(!ready)
      return;


    changing=true;


    player.seekTo(
      data.time || 0,
      true
    );


    if(
      host ||
      playbackEnabled
    ){

      player.playVideo();

    }


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* ===============================================
     PAUSE
  =============================================== */

  if(
    data.type==="pause"
  ){

    if(!ready)
      return;


    changing=true;


    player.seekTo(
      data.time || 0,
      true
    );


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );


    return;

  }


  /* ===============================================
     VOLUME
  =============================================== */

  if(
    data.type==="volume"
  ){

    if(!ready)
      return;


    player.setVolume(
      data.volume
    );


    document
      .getElementById("volume")
      .value=
      data.volume;


    return;

  }


  /* ===============================================
     STATE REQUEST
  =============================================== */

  if(
    data.type==="request" &&
    host
  ){

    sync();

  }

}


/* =====================================================
   CLOCK
===================================================== */

setInterval(()=>{

  if(
    !host ||
    !conn ||
    !conn.open ||
    !ready ||
    !current
  )
    return;


  send({

    type:"clock",

    time:
      player.getCurrentTime(),

    playing:
      player.getPlayerState()===
      YT.PlayerState.PLAYING

  });

},1000);


/* =====================================================
   CLOCK RECEIVE
===================================================== */

function clock(data){

  if(
    host ||
    !ready ||
    !current ||
    !playbackEnabled
  )
    return;


  let local=
    player.getCurrentTime();


  let drift=
    Math.abs(
      local-data.time
    );


  if(
    drift>0.5
  ){

    changing=true;


    player.seekTo(
      data.time,
      true
    );


    setTimeout(
      ()=>changing=false,
      300
    );

  }


  if(
    data.playing &&
    player.getPlayerState() !==
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.playVideo();


    setTimeout(
      ()=>changing=false,
      300
    );

  }


  if(
    !data.playing &&
    player.getPlayerState()===
    YT.PlayerState.PLAYING
  ){

    changing=true;


    player.pauseVideo();


    setTimeout(
      ()=>changing=false,
      300
    );

  }

}


/* =====================================================
   CONNECTION
===================================================== */

function setup(connection){

  conn=
    connection;


  connection.on(
    "open",
    ()=>{

      status(
        "Connected!"
      );


      /*
        Host sends state.

        User 2 asks for state.
      */

      if(host){

        sync();

      }else{

        send({

          type:"request"

        });

      }

    }
  );


  connection.on(
    "data",
    data=>{

      if(
        data.type===
        "clock"
      ){

        clock(data);

      }else{

        apply(data);

      }

    }
  );


  connection.on(
    "close",
    ()=>{

      status(
        "Disconnected"
      );

    }
  );


  connection.on(
    "error",
    e=>{

      console.error(
        "PeerJS connection error:",
        e
      );

      status(
        "Connection error"
      );

    }
  );

}


/* =====================================================
   PEER
===================================================== */

if(host){

  peer=
    new Peer(room);


  peer.on(
    "open",
    ()=>{

      status(
        "Room ready — share the URL"
      );

    }
  );


  peer.on(
    "connection",
    setup
  );


  peer.on(
    "error",
    e=>{

      console.error(
        "Peer error:",
        e
      );

      status(
        "Peer error: "+e.type
      );

    }
  );


}else{

  peer=
    new Peer();


  peer.on(
    "open",
    ()=>{

      let connection=
        peer.connect(room);


      setup(
        connection
      );

    }
  );


  peer.on(
    "error",
    e=>{

      console.error(
        "Peer error:",
        e
      );

      status(
        "Connection error: "+e.type
      );

    }
  );

}


/* =====================================================
   SHARE
===================================================== */

function share(){

  navigator.clipboard
    .writeText(
      location.href
    );


  status(
    "Room URL copied!"
  );

}


render();

</script>
